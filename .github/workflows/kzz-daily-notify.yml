name: kzz-daily-notify

on:
  schedule:
    - cron: '37 0 * * *'   # UTC 00:37 = 北京时间每天 08:37（避开 09:00 调度高峰，防止 GitHub 延迟或跳过）
  workflow_dispatch:        # 支持手动触发

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Push daily bond notice
        run: python main.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
